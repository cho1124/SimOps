services:
  postgres:
    image: postgres:18
    container_name: simops-postgres
    environment:
      POSTGRES_DB: simops
      POSTGRES_USER: simops
      POSTGRES_PASSWORD: simops-local-only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - simops-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simops -d simops"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  simops-postgres-data:
